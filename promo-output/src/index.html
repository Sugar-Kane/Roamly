<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Roamly Flow — 60s promo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!--
  Deterministic promo. Everything on screen is a pure function of time:
    window.renderAt(seconds)      draws the exact frame for that moment
    window.PROMO.ready            resolves once fonts/images/textures are ready
  URL params: ?format=vertical|wide  &t=12.5 (jump)  &render=1 (no preview controls)
-->
<div id="stage"></div>
<div id="preview" hidden>
  <button id="play">▶︎ Play</button>
  <input id="scrub" type="range" min="0" max="60" step="0.0166667" value="0">
  <span id="time">0.00</span>
  <a id="fmt" href="#"></a>
</div>
<audio id="mix" src="../audio/mix.wav" preload="auto"></audio>
<script src="promo.js"></script>
</body>
</html>
