# Self-healing CI: verify AI-authored fixes, run generated reproduction tests,
# and gate anything that touches a protected surface.
#
# Two entry points:
#   * pull_request labelled `self-healing` — the full verification gauntlet a
#     machine-authored patch must survive before a human is asked to look at it.
#   * workflow_dispatch — run one generated reproduction test on demand.
#
# The design principle: a machine-authored PR gets MORE scrutiny than a human
# one, not less. The safety-gate job below is the enforcement point that stops
# a Level 1 auto-merge from ever touching payments, auth, RLS, or schema — the
# same rule the database enforces, checked again here because a control that
# exists in only one layer is one bug away from not existing.

name: Self-Healing CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      incident_id:
        description: Incident whose reproduction test should run
        required: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: selfheal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1 — protected surfaces. Runs first and fails fast.
  # ---------------------------------------------------------------------------
  safety-gate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'self-healing')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      protected: ${{ steps.check.outputs.protected }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        name: Classify the changed surface
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          FILES=$(git diff --name-only "$BASE" HEAD || true)
          echo "Changed files:"; echo "$FILES"

          # Mirrors public.sh_classify_approval() in the migration. Keep the two
          # lists in sync — a divergence means CI and the database disagree
          # about what is safe, and the safe assumption is that CI is wrong.
          PROTECTED=0
          while read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              supabase/*|api/billing.ts|api/stripe-webhook.ts|api/delete-account.ts|api/admin-*|\
              api/invite.ts|src/Auth.tsx|src/AccountSettings.tsx|.github/*|*.env*|vercel.json)
                echo "::warning file=$f::protected surface"
                PROTECTED=1 ;;
            esac
            if git diff "$BASE" HEAD -- "$f" | grep -qiE '^\+.*(stripe|is_premium|service_role|row level security|create policy|grant |revoke |auth\.uid)'; then
              echo "::warning file=$f::protected keyword in added lines"
              PROTECTED=1
            fi
          done <<< "$FILES"

          echo "protected=$PROTECTED" >> "$GITHUB_OUTPUT"

      - name: Block auto-merge on protected surfaces
        if: steps.check.outputs.protected == '1' && github.event_name == 'pull_request'
        run: |
          echo "::notice::This PR touches a protected surface (payments, auth, RLS, schema, CI, or secrets)."
          echo "::notice::Level 3 — engineering review required. Auto-merge is disabled for this PR."
          # Not a failure: the PR is legitimate and should still be reviewed.
          # It simply must never be merged by automation.

  # ---------------------------------------------------------------------------
  # Gate 2 — the standard bar, applied to machine-authored code too.
  # ---------------------------------------------------------------------------
  verify:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'self-healing')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright suite (including any generated regression tests)
        run: npx playwright test

      - name: Accessibility check
        run: npx playwright test tests/a11y.spec.ts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Gate 3 — dependency and secret scanning. A generated patch that adds a
  # dependency or leaks a key is the failure mode with the worst blast radius.
  # ---------------------------------------------------------------------------
  security-scan:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'self-healing')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reject dependency changes in machine-authored patches
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$BASE" HEAD | grep -qE '^(package\.json|package-lock\.json)$'; then
            echo "::error::A self-healing patch must not change dependencies."
            echo "Supply-chain risk is not something automation gets to take on its own."
            exit 1
          fi

      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high || echo "::warning::npm audit reported findings"

      - name: Scan added lines for secrets
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          if git diff "$BASE" HEAD | grep -nE '^\+.*(sk_live_|sk-ant-|whsec_|gh[pousr]_[A-Za-z0-9]{20,}|SUPABASE_SERVICE_ROLE_KEY\s*=)'; then
            echo "::error::Possible secret in added lines."
            exit 1
          fi
          echo "No secret patterns in added lines."

  # ---------------------------------------------------------------------------
  # Report back. The dashboard reads patch status from the database, so CI
  # results have to travel back there — otherwise a reviewer sees "ci_running"
  # forever.
  # ---------------------------------------------------------------------------
  report:
    if: always() && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'self-healing')
    needs: [safety-gate, verify, security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post verification result to the incident
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "Supabase secrets not configured; skipping status write."
            exit 0
          fi
          STATUS="ci_passed"
          if [ "${{ needs.verify.result }}" != "success" ] || [ "${{ needs.security-scan.result }}" != "success" ]; then
            STATUS="ci_failed"
          elif [ "${{ needs.safety-gate.outputs.protected }}" = "1" ]; then
            STATUS="awaiting_approval"
          fi
          curl -sS -X PATCH \
            "$SUPABASE_URL/rest/v1/sh_patches?github_pr_number=eq.${{ github.event.pull_request.number }}" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "content-type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"status\":\"$STATUS\",\"ci_run_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          echo "Reported $STATUS"
