# Rebuild the bundled focus-music library.
#
# The previous version of this workflow hardcoded a track list, tried
# freepd.com first (that site closed permanently in 2025, so every one of those
# attempts now 404s), and committed source files untouched — which is how the
# library reached ~500MB with a single 82MB track. All of that now lives in
# scripts/fetch-music.mjs, which selects per channel from incompetech's own
# catalog and re-encodes to ~112kbps at -16 LUFS.
#
# Day to day you do not need this: the admin dashboard's Music section uploads
# straight to Supabase Storage without a deploy. Run this when you want to
# refresh or expand the bundled library that ships with the app.
name: Fetch focus music
on:
  workflow_dispatch:
    inputs:
      tracks_per_channel:
        description: "Tracks to fetch per channel"
        required: false
        default: "16"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Fetch, transcode, and rebuild the manifest
        # Passed through env, not interpolated into the script, so the input
        # can't inject shell syntax.
        env:
          TRACKS_PER_CHANNEL: ${{ inputs.tracks_per_channel }}
        run: node scripts/fetch-music.mjs "$TRACKS_PER_CHANNEL"
      # The rows still have to be registered in public.music_tracks before the
      # player sees them. Kept as an artifact rather than executed here so no
      # database credentials are needed in CI.
      - name: Upload catalog SQL
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supabase-seed-sql
          path: supabase-seed.sql
          retention-days: 14
      - name: Report library size
        run: |
          du -sh public/audio
          echo "tracks: $(find public/audio -name '*.mp3' | wc -l)"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "Refresh bundled focus music (Kevin MacLeod, CC BY 4.0)"
          git push
